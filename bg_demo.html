<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動く背景の見本</title>
<style>
/* 見本: CSSだけで動かす背景（動画ファイル不要）。本体 index.html には未反映 */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0f;color:#f2f0ea;font-family:"Hiragino Maru Gothic ProN","Meiryo",sans-serif;min-height:100vh;overflow:hidden}
.bg{position:fixed;inset:-80px;z-index:-1;
  background-image:linear-gradient(rgba(233,211,154,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(233,211,154,.13) 1px,transparent 1px);
  background-size:56px 56px;animation:grid 6s linear infinite;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 80%)}
@keyframes grid{to{transform:translate(56px,56px)}}
.glow{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:float 14s ease-in-out infinite alternate}
.g1{background:#6b4fd8;top:-20vmax;left:-15vmax}
.g2{background:#d8a24f;bottom:-25vmax;right:-15vmax;animation-delay:-7s}
@keyframes float{to{transform:translate(12vmax,8vmax) scale(1.15)}}
.line{position:fixed;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(233,211,154,.7),transparent);z-index:-1;animation:scan 5s linear infinite}
@keyframes scan{from{top:-5%}to{top:105%}}
.box{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.box p{font-size:15px;color:#bdb8aa;line-height:1.9}
.box b{display:block;font-size:26px;color:#fff;margin-bottom:8px}
</style>
</head>
<body>
<div class="bg"></div><div class="glow g1"></div><div class="glow g2"></div><div class="line"></div>
<div class="box"><p><b>動く背景の見本</b>格子がゆっくり流れ、光の玉が漂い、横線が上から下へ走る。<br>CSSだけで動かしていて、動画ファイルは使っていない。</p></div>
</body>
</html>
